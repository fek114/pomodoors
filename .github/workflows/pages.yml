# PomoDoors ön yüzünü (prototip/) GitHub Pages'e yayınlar.
# Şimdilik yalnızca elle çalıştırılır; Pages açıldıktan sonra PomoDoors dalına her push'ta da çalışabilir.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: prototip
      - id: deployment
        uses: actions/deploy-pages@v5
